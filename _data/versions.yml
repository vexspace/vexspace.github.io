# 앱 버전 · 내려받기의 원본 (2026-11-04). 여기서 두 가지가 만들어진다:
#   /pagemark/version.json  — 앱이 강제 업데이트를 가른다 (pagemark-version.json 이 latest · minimum · url 을 JSON 으로 낸다)
#   Pagemark 페이지의 내려받기 드롭다운 (_layouts/project.html) — 적힌 순서대로, 방문한 기기에 맞는 항목이 먼저 보인다
#
# 새 버전을 낼 때: ① 이 저장소 Releases 에 'pagemark-v<버전>' 태그로 설치 파일을 올린다
#                 ② 올린 뒤에 latest · url · size 를 바꾼다 (먼저 바꾸면 받을 파일이 없는데 앱이 막힌다)
# 강제 여부: minimum 을 적으면 "그 버전보다 낮으면 강제", 비우면 latest 의 끝자리를 0 으로 (앞·가운데 자리가 오르면 강제).
#           끝자리 업데이트도 꼭 강제해야 할 때만 minimum 을 적는다.
# 드롭다운: os(굵게) · variant(흐리게) · icon(apple · android · windows) · size. 키 이름(macos · android …)은 앱이 읽으니 바꾸지 않는다.
# calit: 안드로이드 앱의 강제 업데이트는 여전히 Calit 백엔드(/api/config/app-version)가 가른다 — /calit/version.json 은 내려받기 안내용.
pagemark:
  macos:
    latest: "1.2.1"
    # minimum: "1.2.1"
    url: https://github.com/vexspace/vexspace.github.io/releases/download/pagemark-v1.2.1/Pagemark-1.2.1-arm64.dmg
    os: macOS
    variant: Apple Silicon
    icon: apple
    size: 131 MB
  android:
    latest: "1.2.1"
    # minimum: "1.2.1"
    url: https://github.com/vexspace/vexspace.github.io/releases/download/pagemark-v1.2.1/Pagemark-1.2.1.apk
    os: Android
    variant: APK
    icon: android
    size: 5.3 MB
calit:
  macos:
    latest: "1.1.0"
    url: https://github.com/vexspace/vexspace.github.io/releases/download/calit-v1.1.0/Calit-1.1.0-arm64.dmg
    os: macOS
    variant: Apple Silicon
    icon: apple
    size: 17.0 MB
  android:
    latest: "1.1.0"
    url: https://github.com/vexspace/vexspace.github.io/releases/download/calit-v1.1.0/Calit-1.1.0.apk
    os: Android
    variant: APK
    icon: android
    size: 16.8 MB
