# 앱 버전 · 내려받기의 원본 (2026-11-04). 여기서 두 가지가 만들어진다:
#   /pagemark/version.json  — 앱이 강제 업데이트를 가른다 (pagemark-version.json 이 이 값을 그대로 JSON 으로 낸다)
#   Pagemark 페이지의 내려받기 단추 (_layouts/project.html)
#
# 새 버전을 낼 때: ① 이 저장소 Releases 에 'pagemark-v<버전>' 태그로 설치 파일을 올린다
#                 ② 올린 뒤에 latest · url 을 바꾼다 (먼저 바꾸면 받을 파일이 없는데 앱이 막힌다)
# 강제 여부: minimum 을 적으면 "그 버전보다 낮으면 강제", 비우면 latest 의 끝자리를 0 으로 (앞·가운데 자리가 오르면 강제).
#           끝자리 업데이트도 꼭 강제해야 할 때만 minimum 을 적는다.
pagemark:
  macos:
    latest: "1.2.0"
    # minimum: "1.2.0"
    url: https://github.com/vexspace/vexspace.github.io/releases/download/pagemark-v1.2.0/Pagemark-1.2.0-arm64.dmg
    label: macOS (Apple Silicon)
    note: 처음 열 때 "확인되지 않은 개발자" 경고가 뜨면 Finder 에서 앱을 우클릭 › 열기
  android:
    latest: "1.2.0"
    # minimum: "1.2.0"
    url: https://github.com/vexspace/vexspace.github.io/releases/download/pagemark-v1.2.0/Pagemark-1.2.0.apk
    label: Android (APK)
    note: 설치할 때 "출처를 알 수 없는 앱" 허용이 필요해요. Google Play 에서 받은 앱 위에는 설치되지 않아요
