<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; padding: 24px 16px 48px; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; font-size: 16px; line-height: 1.7; color: #1a1a1a; background: #ffffff; word-break: keep-all; }
    main { max-width: 860px; margin: 0 auto; }
    h1 { font-size: 1.7em; line-height: 1.3; margin: 0 0 0.6em; }
    h2 { font-size: 1.25em; margin: 2em 0 0.6em; padding-top: 0.4em; border-top: 1px solid #e3e3e3; }
    h3 { font-size: 1.05em; margin: 1.4em 0 0.4em; }
    table { border-collapse: collapse; width: 100%; margin: 0.8em 0 1.2em; font-size: 0.92em; display: block; overflow-x: auto; }
    th, td { border: 1px solid #d5d5d5; padding: 6px 8px; vertical-align: top; text-align: left; }
    th { background: #f3f3f3; white-space: nowrap; }
    a { color: #0b57d0; }
    code { font-size: 0.92em; background: #f3f3f3; padding: 1px 4px; border-radius: 3px; }
    footer { max-width: 860px; margin: 48px auto 0; font-size: 0.85em; color: #666; border-top: 1px solid #e3e3e3; padding-top: 12px; }
    @media (prefers-color-scheme: dark) {
      body { color: #e6e6e6; background: #121212; }
      h2, footer { border-color: #333; }
      th { background: #1f1f1f; }
      th, td { border-color: #3a3a3a; }
      code { background: #1f1f1f; }
      a { color: #8ab4f8; }
      footer { color: #999; }
    }
  </style>
</head>
<body>
  <main>
{{ content }}
  </main>
  <footer>vexspace · <a href="{{ '/' | relative_url }}">공개 문서 목록</a></footer>
</body>
</html>
